<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>PrimServ · Coordinator demo</title>
  <link rel="stylesheet" href="style.css">
  <script src="model.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><img src="primserv-logo.svg" alt="PrimServ" width="43" height="60"><div><p class="eyebrow">PRIMSERV · LOCAL DEMO · v0.1.0</p><h1 id="title">Coordinator demo</h1></div></header>
  <main>
    <p id="demoNotice" class="notice">Fictional tasks only. No employee records, bookings or messages.</p>
    <div class="toolbar">
      <label><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="pl">Polski</option><option value="uk">Українська</option><option value="ru">Русский</option></select></label>
      <label><span id="filterLabel">Status</span><select id="filter"></select></label>
    </div>
    <p id="fallback" class="notice" hidden></p>
    <p id="storage" role="status" aria-live="polite"></p>
    <p id="summary" role="status" aria-live="polite"></p>
    <section id="tasks" aria-label="Demo tasks"></section>
    <p id="empty" hidden></p>
    <section aria-labelledby="materialsTitle">
      <h2 id="materialsTitle" tabindex="-1">Source materials</h2>
      <div class="toolbar">
        <label><span id="materialsSourceLabel">Local source</span><select id="materialsSource"><option value="snapshot">Snapshot</option><option value="mock">Local mock</option></select></label>
        <label><span id="materialsLabel">Search source text</span><input id="materialQuery" type="search" maxlength="120"></label>
      </div>
      <p id="materialsNotice" class="muted"></p>
      <p id="materialsStatus" role="status" aria-live="polite"></p>
      <div class="toolbar">
        <button id="lastMaterialReturn" type="button" disabled>Return to last material</button>
        <button id="lastMaterialClear" type="button" disabled>Clear last material</button>
      </div>
      <p id="lastMaterialNotice" role="status" aria-live="polite"></p>
      <div id="materials"></div>
      <div id="materialReading" hidden></div>
      <section aria-labelledby="favouritesTitle">
        <h3 id="favouritesTitle" tabindex="-1">Pinned materials</h3>
        <p id="favouritesHelp" class="muted"></p>
        <p id="favouritesNotice" role="status" aria-live="polite"></p>
        <div id="favouritesList"></div>
        <button id="favouritesClear" type="button" hidden>Clear pinned-material record</button>
      </section>
    </section>
    <section id="progressBackup" aria-labelledby="backupTitle">
      <h2 id="backupTitle" tabindex="-1">Demo progress backup</h2>
      <h3 id="progressSummaryTitle">Demo progress summary</h3>
      <p id="progressSummaryHelp" class="muted"></p>
      <label for="progressSummary" id="progressSummaryLabel">All three fictional demo tasks (read only)</label>
      <textarea id="progressSummary" rows="9" readonly spellcheck="false" aria-describedby="progressSummaryHelp"></textarea>
      <button id="progressSummarySelect" type="button">Select summary text</button>
      <p id="backupHelp" class="muted"></p>
      <button id="backupExport" type="button">Export demo JSON</button>
      <label for="backupOutput" id="backupOutputLabel">Current demo JSON (read only)</label>
      <textarea id="backupOutput" rows="7" readonly spellcheck="false"></textarea>
      <label for="backupInput" id="backupInputLabel">Paste demo JSON to restore</label>
      <textarea id="backupInput" rows="7" maxlength="2048" spellcheck="false"></textarea>
      <button id="backupPreview" type="button">Preview restore</button>
      <p id="backupNotice" tabindex="-1" role="status" aria-live="polite"></p>
      <div id="backupReview" hidden>
        <h3 id="backupReviewTitle" tabindex="-1">Review all three demo statuses</h3>
        <ul id="backupChanges"></ul>
        <button id="backupApply" type="button">Apply demo statuses</button>
        <button id="backupCancel" type="button">Cancel</button>
      </div>
    </section>
    <section class="reset-area">
      <button id="reset" type="button">Reset demo progress</button>
      <div id="resetConfirm" hidden>
        <p id="confirmText">Remove this demo's progress?</p>
        <button id="confirm" type="button">Reset</button><button id="cancel" type="button">Cancel</button>
      </div>
    </section>
    <p id="offline" class="muted"></p>
    <nav id="links" aria-label="PrimServ links"></nav>
    <noscript>JavaScript is required for the demo. No data has been sent. Для работы демонстрации включите JavaScript. Данные не отправлялись.</noscript>
  </main>
</body>
</html>
