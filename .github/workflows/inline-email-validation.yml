name: Inline optional email validation

on:
  push:
    branches: [codex/personal-inline-email-validation]
    paths:
      - .github/browser/inline-email-validation.mjs
      - .github/workflows/inline-email-validation.yml

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Exact unchanged-public-source diagnostic
        run: |
          echo "TESTED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "TESTED_BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          node scripts/build-pages-artifact.mjs build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          node scripts/build-pages-artifact.mjs verify "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          git diff --exit-code
      - name: Install pinned Chromium tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/primserv-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/primserv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Observe optional email errors and recovery without delivery
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/primserv-browser/node_modules/playwright
          PAGES_ARTIFACT: ${{ runner.temp }}/primserv-pages
          BROWSER_REPORT: ${{ runner.temp }}/primserv-email-report
        run: node .github/browser/inline-email-validation.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inline-email-validation
          path: ${{ runner.temp }}/primserv-email-report
          if-no-files-found: error
