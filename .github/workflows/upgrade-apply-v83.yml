name: Upgrade recruitment form to 8.3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-apply-v83.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upgrade-apply-v83
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply mobile UX improvements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing patch target: {label}')
              return text.replace(old, new, 1)

          # Version and cache busting.
          for file_name in ['apply/config.js', 'apply/index.html', 'scripts/validate-apply.mjs', '.github/workflows/pages.yml']:
              text = read(file_name)
              if '8.2.0' not in text:
                  raise SystemExit(f'Expected 8.2.0 in {file_name}')
              write(file_name, text.replace('8.2.0', '8.3.0'))

          config = read('apply/config.js').replace(
              "storageKey: 'citronex_recruitment_application_v8_2'",
              "storageKey: 'citronex_recruitment_application_v8_3'"
          )
          write('apply/config.js', config)

          app_path = 'apply/app-mobile.js'
          app = read(app_path)

          source_helpers = r'''

          function sourceIcon(value) {
            return ({
              facebook: '📘', instagram: '📸', tiktok: '🎵', telegram: '✈️',
              whatsapp: '💬', viber: '📞', referral: '🤝', recruiter: '👤', other: '＋'
            })[value] || '•';
          }

          function sourceCards() {
            const options = coreLocale().options?.sources || I18N.locales.en.options.sources;
            return `
              <div class="source-choice-grid">
                ${Object.entries(options).map(([value, label]) => {
                  const selected = state.data.source === value;
                  return `
                    <label class="source-choice-card ${selected ? 'selected' : ''}">
                      <input type="radio" name="source" data-field="source" value="${attr(value)}" ${selected ? 'checked' : ''}>
                      <span class="source-choice-icon" aria-hidden="true">${sourceIcon(value)}</span>
                      <span class="source-choice-label">${escapeHtml(label)}</span>
                      <span class="source-choice-check" aria-hidden="true">✓</span>
                    </label>`;
                }).join('')}
              </div>
              ${errorHtml('source')}`;
          }
          '''
          app = replace_once(app, '\n  function partnerBadge() {', source_helpers + '\n\n  function partnerBadge() {', 'source helpers')

          old_source = (
              '        <div class="field full">\n'
              '          <label for="source">${escapeHtml(t(\'source\'))} <span class="required">*</span></label>\n'
              "          ${selectHtml('source', 'sources')}\n"
              '        </div>'
          )
          new_source = (
              '        <div class="field full">\n'
              '          <span class="fieldset-title">${escapeHtml(t(\'source\'))} <span class="required">*</span></span>\n'
              '          ${sourceCards()}\n'
              '        </div>'
          )
          app = replace_once(app, old_source, new_source, 'visual source selector')
          app = replace_once(
              app,
              "if (['filledBy', 'location'].includes(field)) renderForm();",
              "if (['filledBy', 'location', 'source'].includes(field)) renderForm();",
              'source card rerender'
          )
          app = replace_once(
              app,
              'type="${type}" maxlength="${max}"',
              'type="${type}" enterkeyhint="next" maxlength="${max}"',
              'mobile enter key'
          )

          start = app.index("  function buildEmailBody(level = 'full') {")
          end = app.index('\n  function emailSubject() {', start)
          if start < 0 or end < 0:
              raise SystemExit('Email body function could not be located')
          email_function = r'''  function buildEmailBody(level = 'full') {
            const data = state.data;
            const person = recruiter();
            const table = emailRows(level)
              .map(([label, value]) => `${cleanCell(label)}\t${cleanCell(value)}`)
              .join('\n');
            const values = excelValues(level).join('\t');
            return [
              'CITRONEX / PPO SIECHNICE — NOWE ZGŁOSZENIE KANDYDATA',
              '',
              'PRIORYTET — PIERWSZY KONTAKT DO 24 GODZIN',
              `ID\t${state.id}`,
              `SLA do\t${slaDate()}`,
              `Rekruter\t${person?.name || ''}`,
              `Telefon\t${cleanCell(data.phone)}`,
              `Komunikator\t${polishOption('messenger', data.messenger)}`,
              `Lokalizacja\t${locationPolish()}`,
              `Stanowisko\t${polishOption('jobs', data.job)}`,
              `Źródło\t${polishOption('sources', data.source)} — ${cleanCell(data.sourceDetails, 100)}`,
              '',
              'SZCZEGÓŁY KANDYDATA',
              'Pole\tWartość',
              table,
              '',
              'DANE DO EXCEL — WKLEJ PONIŻSZY WIERSZ DO PIERWSZEJ PUSTEJ KOMÓRKI A',
              values,
              '',
              'Status początkowy: NOWY',
              `Wersja formularza: ${CFG.version}`
            ].join('\n');
          }
          '''
          app = app[:start] + email_function + app[end:]
          app = app.replace('[NOWY KANDYDAT][', '[NOWY KANDYDAT][SLA 24H][', 1)

          start = app.index('  function openEmail() {')
          end = app.index('\n  function nextCandidateInGroup() {', start)
          if start < 0 or end < 0:
              raise SystemExit('Email launch function could not be located')
          open_email = r'''  function openEmail() {
            if (!recruiter()) { view = 'recruiter'; render(); return; }
            const button = app.querySelector('[data-action="send"]');
            if (button?.disabled) return;
            if (button) {
              button.disabled = true;
              button.setAttribute('aria-busy', 'true');
            }
            const result = document.getElementById('result');
            result.textContent = x('emailOpened');
            result.classList.remove('hidden');
            saveDraft();
            const mailto = buildMailto();
            window.setTimeout(() => {
              if (!button) return;
              button.disabled = false;
              button.removeAttribute('aria-busy');
            }, 2500);
            window.location.assign(mailto);
          }
          '''
          app = app[:start] + open_email + app[end:]
          write(app_path, app)

          css_path = 'apply/mobile-v8.css'
          css = read(css_path)
          marker = '/* v8.3 tap-first source selection */'
          if marker not in css:
              css += r'''

          /* v8.3 tap-first source selection */
          .source-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}
          .source-choice-card{position:relative;min-height:76px;display:grid;grid-template-columns:36px minmax(0,1fr) 22px;align-items:center;gap:8px;padding:10px 9px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--text);cursor:pointer;transition:border-color .14s ease,background .14s ease,box-shadow .14s ease}
          .source-choice-card input{position:absolute;opacity:0;pointer-events:none}
          .source-choice-card.selected{border-color:var(--brand-2);background:#f1fbf5;box-shadow:0 0 0 3px var(--brand-soft)}
          .source-choice-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--surface-soft);font-size:19px}
          .source-choice-label{font-size:12px;font-weight:850;line-height:1.25;overflow-wrap:anywhere}
          .source-choice-check{width:21px;height:21px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:50%;background:#fff;color:transparent;font-size:12px;font-weight:900}
          .source-choice-card.selected .source-choice-check{border-color:var(--brand);background:var(--brand);color:#fff}
          .send-button[aria-busy="true"]{opacity:.7;pointer-events:none}
          @media(hover:hover){.source-choice-card:hover{border-color:var(--brand-2);background:#f7fcf9}}
          @media(max-width:520px){.source-choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.source-choice-card{min-height:70px}}
          @media(max-width:360px){.source-choice-grid{grid-template-columns:1fr}.source-choice-card{min-height:58px}}
          '''
          write(css_path, css)

          validator_path = 'scripts/validate-apply.mjs'
          validator = read(validator_path)
          validator = replace_once(
              validator,
              "'data-action=\"send\"', 'data-action=\"next-candidate\"'",
              "'data-action=\"send\"', 'data-action=\"next-candidate\"', 'function sourceCards()',\n  \"['filledBy', 'location', 'source']\", 'PRIORYTET — PIERWSZY KONTAKT DO 24 GODZIN'",
              'application validator markers'
          )
          validator = replace_once(
              validator,
              "'.batch-button', '.fast-language-grid', 'font-size:16px', '@media(max-width:520px)'",
              "'.batch-button', '.fast-language-grid', '.source-choice-grid', '.source-choice-card', 'font-size:16px', '@media(max-width:520px)'",
              'CSS validator markers'
          )
          write(validator_path, validator)

          pages_path = '.github/workflows/pages.yml'
          pages = read(pages_path)
          pages = replace_once(
              pages,
              "          grep -q 'sourceDetails' apply/app-mobile.js",
              "          grep -q 'sourceDetails' apply/app-mobile.js\n          grep -q 'source-choice-grid' apply/mobile-v8.css\n          grep -q 'function sourceCards' apply/app-mobile.js",
              'Pages production checks'
          )
          write(pages_path, pages)
          PY

      - name: Validate complete repository
        run: npm test

      - name: Commit upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/upgrade-apply-v83.yml
          git add apply/config.js apply/index.html apply/app-mobile.js apply/mobile-v8.css scripts/validate-apply.mjs .github/workflows/pages.yml
          git commit -m "Improve mobile source selection and recruiter email"
          git push
