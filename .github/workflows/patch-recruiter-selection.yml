name: Install recruiter selector
on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-recruiter-selection.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Patch application
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apply/index.html'); s=p.read_text(encoding='utf-8')
          if 'id="recruiterScreen"' in s and 'yana.radushynska@pposiechnice.pl' in s:
              print('Already installed'); raise SystemExit(0)
          def r(a,b,label):
              global s
              if a not in s: raise SystemExit('Missing marker: '+label)
              s=s.replace(a,b,1)

          css=""".recruiter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.recruiter-btn{width:100%;min-height:88px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left;padding:13px;display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:11px;color:var(--text)}.recruiter-btn:hover,.recruiter-btn:focus-visible,.recruiter-btn.selected{border-color:var(--accent);outline:3px solid #dbeafe;background:#f8fbff}.recruiter-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent2);font-weight:900}.recruiter-name{font-weight:850}.recruiter-email{display:block;color:var(--muted);font-size:12px;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;margin-top:3px}.recruiter-arrow{font-size:22px;color:var(--accent)}.route-links{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end}.selected-recruiter{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:13px;margin-bottom:15px}.selected-recruiter strong{display:block}.selected-recruiter small{display:block;color:#475569;margin-top:2px;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}.recruiter-back{border:0;background:none;color:var(--accent);font-weight:750;padding:8px 0}.language-chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted);background:#f8fafc}.recruiter-help{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}\n"""
          r('@media(max-width:580px){.langs,.grid2,.delivery-grid,.trust{grid-template-columns:1fr}',css+'@media(max-width:580px){.langs,.recruiter-grid,.grid2,.delivery-grid,.trust{grid-template-columns:1fr}','css')

          html='''<section id="recruiterScreen" class="card hidden">
  <div class="topline"><button id="backToLanguages" type="button" class="recruiter-back"></button><span id="chosenLanguageChip" class="language-chip"></span></div>
  <div class="hero"><div class="globe">👤</div><h1 id="recruiterTitle"></h1><p id="recruiterSub"></p></div>
  <div id="recruiterGrid" class="recruiter-grid" role="list"></div>
  <p id="recruiterHelp" class="recruiter-help"></p>
</section>

<section id="formScreen" class="card hidden">'''
          r('<section id="formScreen" class="card hidden">',html,'screen')
          r('<div class="topline"><span id="candidateChip" class="idchip ltr"></span><button id="changeLanguage" type="button" class="change-lang">🌍 Language</button></div>','''<div class="topline"><span id="candidateChip" class="idchip ltr"></span><div class="route-links"><button id="changeLanguage" type="button" class="change-lang">🌍 Language</button><button id="changeRecruiter" type="button" class="change-lang">👤 Recruiter</button></div></div>
  <div class="selected-recruiter"><span aria-hidden="true">👤</span><span><strong id="selectedRecruiterName"></strong><small id="selectedRecruiterEmail"></small></span></div>''','controls')

          r("const DEFAULT_EMAIL='oleksandr.kiris@icloud.com';\nconst RECRUITERS={oleksandr:{name:'Oleksandr',email:DEFAULT_EMAIL}};\nconst STORAGE_KEY='kiris_jobs_application_v2', LANG_KEY='kiris_jobs_language_v2';", """const RECRUITERS={yana:{name:'Yana Radushynska',email:'yana.radushynska@pposiechnice.pl'},yuliia:{name:'Yuliia Korniienko',email:'yuliia.korniienko@pposiechnice.pl'},fariz:{name:'Fariz Injaev',email:'fariz.injaev@pposiechnice.pl'},oleksandr:{name:'Oleksandr Kiris',email:'oleksandr.kiris@pposiechnice.pl'},maksym:{name:'Maksym Saliuk',email:'maksym.saliuk@pposiechnice.pl'},anastasiia:{name:'Anastasiia Derepa',email:'anastasiia.derepa@citronex.pl'}};
const STORAGE_KEY='kiris_jobs_application_v3', LANG_KEY='kiris_jobs_language_v3';""",'directory')

