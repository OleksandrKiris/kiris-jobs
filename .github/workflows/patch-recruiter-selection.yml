function rt(i){const a=ROUTE_I18N[lang]||ROUTE_I18N.en;return a[i]||ROUTE_I18N.en[i]}\n"""
          r('const EN={',i18n+'const EN={','i18n')
          r("let lang='en',step=1,id=null;","let lang='en',step=1,id=null,recruiterKey='',recruiter=null;",'state')
          r("const params=new URLSearchParams(location.search); const campaign=clean(params.get('campaign')||''); const urlSource=clean(params.get('src')||''); const recruiterKey=(params.get('recruiter')||'').toLowerCase(); const recruiter=RECRUITERS[recruiterKey]||RECRUITERS.oleksandr;","const params=new URLSearchParams(location.search); const campaign=clean(params.get('campaign')||''); const urlSource=clean(params.get('src')||''); const requestedRecruiterKey=(params.get('recruiter')||'').toLowerCase(); if(RECRUITERS[requestedRecruiterKey]){recruiterKey=requestedRecruiterKey;recruiter=RECRUITERS[recruiterKey];}",'params')
          r("function save(){if(!id)return;localStorage.setItem(STORAGE_KEY,JSON.stringify({id,lang,step,data:formData(),savedAt:Date.now()}));localStorage.setItem(LANG_KEY,lang)}","function save(){if(!id)return;localStorage.setItem(STORAGE_KEY,JSON.stringify({id,lang,step,recruiterKey,data:formData(),savedAt:Date.now()}));localStorage.setItem(LANG_KEY,lang)}",'save')
          r("function restore(d){id=d.id||makeId();lang=d.lang||'en';step=Math.min(3,Math.max(1,d.step||1));setLanguage(lang,false);FIELDS.forEach(f=>{if(d.data&&d.data[f]!=null)$(f).value=d.data[f]});$('consent').checked=!!(d.data&&d.data.consent);showForm();}","function restore(d){id=d.id||makeId();lang=d.lang||'en';step=Math.min(3,Math.max(1,d.step||1));recruiterKey=RECRUITERS[d.recruiterKey]?d.recruiterKey:'';recruiter=recruiterKey?RECRUITERS[recruiterKey]:null;setLanguage(lang,false);FIELDS.forEach(f=>{if(d.data&&d.data[f]!=null)$(f).value=d.data[f]});$('consent').checked=!!(d.data&&d.data.consent);if(recruiter)showForm();else showRecruiters();}",'restore')
          r("$('changeLanguage').textContent='🌍 '+t('changeLanguage');","$('changeLanguage').textContent='🌍 '+t('changeLanguage');$('changeRecruiter').textContent='👤 '+rt(3);$('recruiterTitle').textContent=rt(0);$('recruiterSub').textContent=rt(1);$('backToLanguages').textContent='← '+rt(2);$('recruiterHelp').textContent=rt(5);",'labels')
          r("if(start){id=id||makeId();step=1;showForm();save()}renderStep()","if(start){id=id||makeId();step=1;showRecruiters();save()}renderStep()",'route')

          funcs="""function recruiterInitials(n){return n.split(/\\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function updateRecruiterSummary(){if(!recruiter)return;$('selectedRecruiterName').textContent=rt(4)+': '+recruiter.name;$('selectedRecruiterEmail').textContent=recruiter.email}
function renderRecruiters(){$('recruiterGrid').innerHTML=Object.entries(RECRUITERS).map(([k,v])=>`<button type=\"button\" class=\"recruiter-btn${k===recruiterKey?' selected':''}\" data-recruiter=\"${k}\" aria-pressed=\"${k===recruiterKey}\"><span class=\"recruiter-avatar\">${esc(recruiterInitials(v.name))}</span><span><span class=\"recruiter-name\">${esc(v.name)}</span><span class=\"recruiter-email\">${esc(v.email)}</span></span><span class=\"recruiter-arrow\">›</span></button>`).join('');document.querySelectorAll('[data-recruiter]').forEach(b=>b.addEventListener('click',()=>selectRecruiter(b.dataset.recruiter)))}
function showRecruiters(){$('languageScreen').classList.add('hidden');$('formScreen').classList.add('hidden');$('reviewScreen').classList.add('hidden');$('resumeBanner').classList.add('hidden');$('recruiterScreen').classList.remove('hidden');$('recruiterTitle').textContent=rt(0);$('recruiterSub').textContent=rt(1);$('backToLanguages').textContent='← '+rt(2);$('recruiterHelp').textContent=rt(5);$('chosenLanguageChip').textContent=LANGS[lang][0]+' '+LANGS[lang][1];renderRecruiters();scrollTo({top:0,behavior:'smooth'})}
function selectRecruiter(k){if(!RECRUITERS[k])return;recruiterKey=k;recruiter=RECRUITERS[k];updateRecruiterSummary();showForm();save()}\n"""
          r('function renderStep(){',funcs+'function renderStep(){','functions')
