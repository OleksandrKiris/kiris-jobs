          r("function resetAll(){localStorage.removeItem(STORAGE_KEY);id=makeId();step=1;FIELDS.forEach(f=>$(f).value='');$('consent').checked=false;$('reviewScreen').classList.add('hidden');$('formScreen').classList.add('hidden');$('languageScreen').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}","function resetAll(){localStorage.removeItem(STORAGE_KEY);id=null;step=1;recruiterKey='';recruiter=null;FIELDS.forEach(f=>$(f).value='');$('consent').checked=false;$('reviewScreen').classList.add('hidden');$('formScreen').classList.add('hidden');$('recruiterScreen').classList.add('hidden');$('languageScreen').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}",'reset')
          r("$('changeLanguage').addEventListener('click',()=>{$('formScreen').classList.add('hidden');$('languageScreen').classList.remove('hidden')});$('mailBtn').addEventListener('click',mail);","$('changeLanguage').addEventListener('click',()=>{$('formScreen').classList.add('hidden');$('reviewScreen').classList.add('hidden');$('recruiterScreen').classList.add('hidden');$('languageScreen').classList.remove('hidden');save()});$('changeRecruiter').addEventListener('click',showRecruiters);$('backToLanguages').addEventListener('click',()=>{$('recruiterScreen').classList.add('hidden');$('languageScreen').classList.remove('hidden')});$('mailBtn').addEventListener('click',mail);",'events')

          for a in ['yana.radushynska@pposiechnice.pl','yuliia.korniienko@pposiechnice.pl','fariz.injaev@pposiechnice.pl','oleksandr.kiris@pposiechnice.pl','maksym.saliuk@pposiechnice.pl','anastasiia.derepa@citronex.pl']:
              assert a in s, a
          p.write_text(s,encoding='utf-8')
          js=s[s.index('<script>')+8:s.rindex('</script>')]
