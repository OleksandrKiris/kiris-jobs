          r("`Rekruter: ${recruiter.name}`,`Źródło linku: ${routeSource(d)}`","`Rekruter: ${recruiter.name}`,`E-mail rekrutera: ${recruiter.email}`,`Źródło linku: ${routeSource(d)}`",'mail recipient')
          r("routeSource(d),campaign,recruiter.name,d.comment]","routeSource(d),campaign,recruiter.name,recruiter.email,d.comment]",'excel recipient')
