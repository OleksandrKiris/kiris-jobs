name: Install recruiter selector

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-recruiter-selection.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch application
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/patch.py
          python /tmp/patch.py
          node --check /tmp/apply.js
          grep -q 'id="recruiterScreen"' apply/index.html
          grep -q 'yana.radushynska@pposiechnice.pl' apply/index.html
          grep -q 'anastasiia.derepa@citronex.pl' apply/index.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apply/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add mandatory recruiter selection to application form'
          git push
