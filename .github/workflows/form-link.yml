name: Public form link sharing

on:
  pull_request:
    paths:
      - .github/browser/form-link.mjs
      - .github/browser/form-link.test.mjs
      - .github/browser/fixtures/form-link.json
      - .github/workflows/form-link.yml
      - apply/**

permissions:
  contents: read

jobs:
  public-form-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 32
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Exact event base and staged publication
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python quality/security/exact_base.py
          node scripts/build-pages-artifact.mjs build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          node scripts/build-pages-artifact.mjs verify "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          git diff --exit-code
      - name: Install pinned Chromium tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/primserv-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/primserv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual public link UI and Clipboard/manual recovery without delivery
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/primserv-browser/node_modules/playwright
          PAGES_ARTIFACT: ${{ runner.temp }}/primserv-pages
          BROWSER_REPORT: ${{ runner.temp }}/primserv-public-link-report
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/browser/form-link.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-form-link
          path: ${{ runner.temp }}/primserv-public-link-report
          if-no-files-found: error
