name: Install branded recruitment form v5.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-apply-v5-2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install branded application files
        shell: bash
        run: |
          rm -f apply/app.js apply/config.js apply/i18n-core.js apply/i18n-caucasus-central.js apply/i18n-asia.js apply/styles.css
          echo '[... ELLIPSIZATION ...]' | base64 --decode > /tmp/apply-v5-2.tar.gz
          tar -xzf /tmp/apply-v5-2.tar.gz
          npm test

      - name: Commit application update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apply package.json scripts/validate-apply.mjs
          if git diff --cached --quiet; then
            echo 'No application changes to commit.'
            exit 0
          fi
          git commit -m 'Upgrade recruitment form to branded v5.2 interface'
          git push
