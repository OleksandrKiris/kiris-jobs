name: Install improved recruitment application

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-apply-v51.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install application package
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .apply-update-v51.b64 > /tmp/apply-update-v51.tar.gz
          rm -rf apply
          mkdir -p apply
          tar -xzf /tmp/apply-update-v51.tar.gz -C apply
          node --check apply/assets/app.js
          node apply/tests/validate.mjs

      - name: Commit upgraded application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .apply-update-v51.b64 .github/workflows/install-apply-v51.yml
          git add apply
          git commit -m "Upgrade recruitment application interface and Excel workflow"
          git push
