name: Проверка и публикация портала

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Проверить JavaScript, контент и анкету
        run: npm test

      - name: Проверить чистую production-структуру
        shell: bash
        run: |
          set -euo pipefail

          test -s apply/index.html
          test -s apply/styles.css
          test -s apply/config.js
          test -s apply/translations.js
          test -s apply/app.js
          grep -q 'styles.css?v=17.2.0' apply/index.html
          grep -q 'translations.js?v=17.0.0' apply/index.html
          grep -q 'app.js?v=17.2.0' apply/index.html
          grep -q 'href="pdf/"' apply/index.html
          grep -q 'function sendRow' apply/app.js
          grep -q 'CFG.excelColumns.length' apply/app.js
          grep -q 'window.location.assign(mailto)' apply/app.js
          ! grep -qi '\bcsv\b' apply/index.html apply/app.js
          ! grep -q 'type="file"' apply/index.html apply/app.js
          ! grep -q 'navigator.share' apply/app.js
          ! grep -q 'position:sticky\|position:fixed\|backdrop-filter' apply/styles.css
          test "$(grep -c 'rel="stylesheet"' apply/index.html)" -eq 1

          test -s apply/pdf/index.html
          test -s apply/pdf/styles.css
          test -s apply/pdf/app.js
          grep -q 'styles.css?v=1.1.0' apply/pdf/index.html
          grep -q 'app.js?v=1.1.1' apply/pdf/index.html
          grep -q 'window.print()' apply/pdf/app.js
          grep -q 'URL.createObjectURL' apply/pdf/app.js
          grep -q 'minmax(0,420px)' apply/pdf/styles.css
          ! grep -q 'position:sticky\|position:fixed\|min-max(' apply/pdf/styles.css
          ! grep -Eqi '\b(csv|xlsx|tsv|zip)\b' apply/pdf/index.html apply/pdf/styles.css apply/pdf/app.js
          ! grep -q 'navigator.share\|mailto:\|wa.me\|viber://' apply/pdf/app.js

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6

      - name: Подготовить статические файлы
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
