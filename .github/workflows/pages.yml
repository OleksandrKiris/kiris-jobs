name: Проверка и публикация портала

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить JavaScript, контент и анкету
        run: npm test

      - name: Проверить production-файлы анкеты
        run: |
          test -s apply/index.html
          test -s apply/styles.css
          test -s apply/config.js
          test -s apply/i18n-extra.js
          test -s apply/app.js
          grep -q 'styles.css?v=7.0.0' apply/index.html
          grep -q 'i18n-extra.js?v=7.0.0' apply/index.html
          grep -q 'app.js?v=7.0.0' apply/index.html
          grep -q 'citronex-logo.jpg' apply/index.html
          grep -q "version: '7.0.0'" apply/config.js
          grep -q 'buildMailto' apply/app.js
          grep -q 'sourceDetails' apply/app.js
          grep -q 'representativeName' apply/app.js

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовить статические файлы
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
