name: Проверка и публикация портала

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Проверить JavaScript, контент и анкету
        run: npm test

      - name: Проверить production-файлы анкеты
        run: |
          set -euo pipefail
          test -s apply/index.html
          test -s apply/styles.css
          test -s apply/mobile-v8.css
          test -s apply/ui-v9.css
          test -s apply/ui-v9.js
          test -s apply/ui-v11.css
          test -s apply/ui-v11.js
          test -s apply/delivery-v10.css
          test -s apply/delivery-v10-i18n.js
          test -s apply/delivery-v10.js
          test -s apply/config.js
          test -s apply/i18n-extra.js
          test -s apply/i18n-mobile.js
          test -s apply/app-mobile.js
          grep -q 'styles.css?v=8.3.0' apply/index.html
          grep -q 'mobile-v8.css?v=8.3.0' apply/index.html
          grep -q 'ui-v9.css?v=9.0.0' apply/index.html
          grep -q 'delivery-v10.css?v=10.2.0' apply/index.html
          grep -q 'ui-v11.css?v=11.0.0' apply/index.html
          grep -q 'ui-v9.js?v=9.0.0' apply/index.html
          grep -q 'delivery-v10.js?v=10.2.0' apply/index.html
          grep -q 'ui-v11.js?v=11.0.0' apply/index.html
          grep -q 'i18n-mobile.js?v=8.3.0' apply/index.html
          grep -q 'app-mobile.js?v=8.3.0' apply/index.html
          grep -q 'citronex-logo.jpg' apply/index.html
          grep -q "version: '8.3.0'" apply/config.js
          grep -q 'nextCandidateInGroup' apply/app-mobile.js
          grep -q 'routeContextKey' apply/app-mobile.js
          grep -q "\['full', 'compact', 'minimal'\]" apply/app-mobile.js
          grep -q 'sourceDetails' apply/app-mobile.js
          grep -q 'representativeName' apply/app-mobile.js
          grep -q 'function sourceCards' apply/app-mobile.js
          grep -q 'PRIORYTET — PIERWSZY KONTAKT DO 24 GODZIN' apply/app-mobile.js
          grep -q 'source-choice-grid' apply/mobile-v8.css
          grep -q 'TAP_FIELDS' apply/ui-v9.js
          grep -q 'ui-tap-options' apply/ui-v9.css
          grep -q 'ui-step-heading' apply/ui-v9.css
          grep -q 'shareApplication' apply/delivery-v10.js
          grep -q 'delivery-share-primary' apply/delivery-v10.css
          grep -q 'PRIORITY_LANGUAGES' apply/ui-v11.js
          grep -q 'makeReviewAccordions' apply/ui-v11.js
          grep -q 'ui-file-count-badge' apply/ui-v11.css
          ! grep -q 'enhancements-v8.js' apply/index.html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6

      - name: Подготовить статические файлы
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
