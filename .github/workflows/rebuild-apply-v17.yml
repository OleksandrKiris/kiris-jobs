name: Rebuild recruitment system v17

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rebuild-apply-v17.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-apply-v17
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate rebuild script
        run: python -m py_compile scripts/rebuild-apply-v17.py

      - name: Rebuild clean application sources
        run: python scripts/rebuild-apply-v17.py

      - name: Build synchronized Excel templates
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5
          python scripts/build-recruitment-excel.py

      - name: Run complete static test suite
        run: npm test

      - name: Install Chromium for real mobile tests
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real browser scenarios
        run: node scripts/e2e-apply.mjs

      - name: Commit clean production system
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rebuild-apply-v17.yml
          rm -f scripts/rebuild-apply-v17.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish clean tested recruitment system v17"
          git push
