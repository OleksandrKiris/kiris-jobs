name: Install recruitment application v5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-apply-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and install complete application package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/install-apply-v5 -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 5
          cat .github/install-apply-v5/part* | base64 --decode > /tmp/apply-v5.tar.gz
          echo "399ebf0aa40c58e804b972324def7796ae6de9e9282e4027797fc0a95772719e  /tmp/apply-v5.tar.gz" | sha256sum -c -
          tar -xzf /tmp/apply-v5.tar.gz -C .
          node --check apply/config.js
          node --check apply/location-i18n.js
          node --check apply/app.js
          node scripts/validate-apply.mjs

      - name: Commit production application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/install-apply-v5 .github/workflows/install-apply-v5.yml
          git add apply package.json scripts/validate-apply.mjs
          git commit -m "Launch recruitment application v5 with locations and Excel email workflow"
          git push
