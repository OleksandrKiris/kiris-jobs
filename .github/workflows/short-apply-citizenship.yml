name: Short form text required validation

on:
  push:
    branches: [codex/personal-short-apply-citizenship]
    paths:
      - .github/browser/short-apply-citizenship.mjs
      - .github/browser/fixtures/short-apply-citizenship.json
      - .github/workflows/short-apply-citizenship.yml

permissions:
  contents: read

jobs:
  citizenship:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Exact event base and staged publication
        env:
          TESTED_HEAD: ${{ github.sha }}
          TESTED_BASE: unused-for-push
        run: |
          published=$(node -p "JSON.parse(require('fs').readFileSync('.github/browser/fixtures/short-apply-citizenship.json','utf8')).publishedMain")
          [[ "$published" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$published"
          node scripts/build-pages-artifact.mjs build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          node scripts/build-pages-artifact.mjs verify "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          git diff --exit-code
      - name: Install pinned Chromium tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/primserv-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/primserv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Text-field errors and correction without delivery
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/primserv-browser/node_modules/playwright
          PAGES_ARTIFACT: ${{ runner.temp }}/primserv-pages
          BROWSER_REPORT: ${{ runner.temp }}/primserv-citizenship-report
          TESTED_HEAD: ${{ github.sha }}
          TESTED_BASE: unused-for-push
          CASE_SCOPE: firstName,lastName
        run: |
          export TESTED_BASE="$(git rev-parse HEAD^)"
          node .github/browser/short-apply-citizenship.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: short-apply-citizenship
          path: ${{ runner.temp }}/primserv-citizenship-report
          if-no-files-found: error
