name: Inert short form email handoff diagnostic

on:
  push:
    branches: [codex/personal-draft-lifetime-route]
    paths:
      - .github/browser/short-apply-send-row.mjs
      - .github/workflows/short-apply-send-row.yml

permissions:
  contents: read

jobs:
  inert-send-row:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 32
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Exact unchanged runtime and staged publication
        env:
          TESTED_BASE: ${{ github.event.before }}
        run: |
          git fetch --no-tags origin 181088556b9494e66a6188a8597f85917b41b580
          git fetch --no-tags origin 4ae8c3ccae83627fb9606c206b7644e3df9806d5
          git fetch --no-tags origin "$TESTED_BASE"
          test "$(git rev-parse HEAD^)" = "$TESTED_BASE"
          node scripts/build-pages-artifact.mjs build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          node scripts/build-pages-artifact.mjs verify "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          git diff --exit-code
      - name: Install pinned Chromium tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/primserv-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/primserv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Anonymous inert dependency observations without a mail client
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/primserv-browser/node_modules/playwright
          PAGES_ARTIFACT: ${{ runner.temp }}/primserv-pages
          BROWSER_REPORT: ${{ runner.temp }}/primserv-send-report
          TESTED_HEAD: ${{ github.sha }}
          TESTED_BASE: ${{ github.event.before }}
        run: node .github/browser/short-apply-send-row.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: short-apply-send-row
          path: ${{ runner.temp }}/primserv-send-report
          if-no-files-found: error
