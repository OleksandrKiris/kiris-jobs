name: Coordinator storage comparison

on:
  pull_request:
    paths:
      - .github/workflows/coordinator-storage-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Playwright ${{ matrix.playwright }} / sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        playwright: ['1.56.1', '1.64.1']
        sample: [1, 2, 3]
    env:
      TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      TESTED_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
      PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/coordinator-browser/node_modules/playwright
      BROWSER_REPORT: ${{ runner.temp }}/coordinator-storage-report
      COMPARED_PLAYWRIGHT: ${{ matrix.playwright }}
      COMPARISON_SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the matrix's exact browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/coordinator-browser" --no-save --no-package-lock "playwright@$COMPARED_PLAYWRIGHT"
          "$RUNNER_TEMP/coordinator-browser/node_modules/.bin/playwright" install --with-deps chromium
      # A fixed three samples per version. Each failure remains a failed job;
      # neither the product, fixtures, assertions nor browser flags are changed.
      - name: Run unchanged coordinator file acceptance
        run: node coordinator-demo/browser-acceptance.mjs
      - name: Record comparison identity
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const e = process.env;
          await mkdir(e.BROWSER_REPORT, { recursive: true });
          await writeFile(join(e.BROWSER_REPORT, 'comparison.json'), JSON.stringify({
            playwright: e.COMPARED_PLAYWRIGHT, sample: Number(e.COMPARISON_SAMPLE),
            head: e.TESTED_HEAD, base: e.TESTED_BASE,
            checkout: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            run: e.GITHUB_RUN_ID, attempt: e.GITHUB_RUN_ATTEMPT,
            interpretation: 'Fixed-version comparison; a pass alone does not establish cause or durability.'
          }, null, 2) + '\n');
          NODE
      - name: Preserve every comparison report and native browser trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coordinator-storage-pw${{ matrix.playwright }}-sample${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BROWSER_REPORT }}
          if-no-files-found: error
          retention-days: 7
