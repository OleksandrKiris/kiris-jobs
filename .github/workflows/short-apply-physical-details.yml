name: Short form conditional details validation

on:
  push:
    branches: [codex/personal-short-apply-consent]
    paths:
      - .github/browser/short-apply-physical-details.mjs
      - .github/browser/fixtures/short-apply-physical-details.json
      - .github/workflows/short-apply-physical-details.yml

permissions:
  contents: read

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build exact diagnostic publication
        run: |
          for reference in 77408501936e535fa4334903cc50bc365faa7ce0 b5a5316e43e9aa6c5be91de69cb499c775e8c6b4; do
            if ! git cat-file -e "$reference^{commit}"; then
              git fetch --no-tags --depth=1 origin "$reference"
            fi
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/build-pages-artifact.mjs build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          node scripts/build-pages-artifact.mjs verify "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          git diff --exit-code
      - name: Install pinned Chromium tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/primserv-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/primserv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Conditional required error and correction without delivery
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/primserv-browser/node_modules/playwright
          PAGES_ARTIFACT: ${{ runner.temp }}/primserv-pages
          BROWSER_REPORT: ${{ runner.temp }}/primserv-details-report
          TESTED_HEAD: ${{ github.sha }}
        run: |
          export TESTED_BASE="$(git rev-parse HEAD^)"
          node .github/browser/short-apply-physical-details.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: short-apply-physical-details
          path: ${{ runner.temp }}/primserv-details-report
          if-no-files-found: error
