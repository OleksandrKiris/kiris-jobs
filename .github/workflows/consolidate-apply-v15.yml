name: Consolidate recruitment form v15

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/consolidate-apply-v15.yml"
      - ".automation/consolidate-apply-v15.py.gz.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidate-recruitment-form
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build unified application
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .automation/consolidate-apply-v15.py.gz.b64 | gzip --decompress > /tmp/consolidate_apply_v15.py
          python /tmp/consolidate_apply_v15.py
          npm test

      - name: Commit clean architecture
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/consolidate-apply-v15.py.gz.b64
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/consolidate-apply-v15.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Consolidate recruitment form into one app and stylesheet"
          git push origin main
