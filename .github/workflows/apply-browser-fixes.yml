name: Apply browser-tested recruitment fixes

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-browser-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-browser-fixes
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply tested fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # Main form: safe fallbacks for every locale and immediate visual feedback.
          path = Path('apply/app.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "const options = locale().options[group] || I18N.locales.en.options[group];",
              "const options = locale().options?.[group] || I18N.locales.en.options?.[group] || I18N.internal?.[group] || {};"
          )
          text = text.replace(
              "const options = locale().options;",
              "const options = { ...(I18N.locales.en.options || {}), ...(locale().options || {}) };"
          )
          text = text.replace(
              "return groups[field] ? locale().options[groups[field]]?.[value] || value : value;",
              "return groups[field] ? (locale().options?.[groups[field]]?.[value] || I18N.locales.en.options?.[groups[field]]?.[value] || I18N.internal?.[groups[field]]?.[value] || value) : value;"
          )
          old = """        delete errors[field];
                  saveDraft();
                  if (field === 'filledBy') renderForm();
          """
          new = """        delete errors[field];
                  if (element.type === 'radio') {
                    app.querySelectorAll(`input[name="${field}"]`).forEach((input) => {
                      input.closest('.choice-card')?.classList.toggle('selected', input.checked);
                    });
                  }
                  saveDraft();
                  if (field === 'filledBy') renderForm();
          """
          if old in text:
              text = text.replace(old, new)
          if "closest('.choice-card')?.classList.toggle('selected'" not in text:
              raise SystemExit('Choice-card fix was not applied')
          if "locale().options?.[group]" not in text:
              raise SystemExit('Locale fallback fix was not applied')
          path.write_text(text, encoding='utf-8')

          # Translation builder: guaranteed locations even when an old locale lacks them.
          path = Path('apply/translations.js')
          text = path.read_text(encoding='utf-8')
          old = "locations: core.options?.locations || I.locales.en.options.locations"
          new = "locations: core.options?.locations || I.locales.en.options?.locations || E.locales?.[code]?.options?.locations || E.locales?.en?.options?.locations || {siechnice:'Siechnice',ryczywol:'Ryczywół / Kozienice',bogatynia:'Bogatynia',zgorzelec:'Zgorzelec',pruszcz:'Pruszcz Gdański',any:'Dowolna lokalizacja'}"
          if old in text:
              text = text.replace(old, new)
          if "any:'Dowolna lokalizacja'" not in text:
              raise SystemExit('Location fallback was not applied')
          path.write_text(text, encoding='utf-8')

          # Stable normal-flow layout. No sticky or fixed layers on phones.
          path = Path('apply/styles.css')
          text = path.read_text(encoding='utf-8')
          block = r'''
          /* Browser regression hardening: every form element stays in normal flow. */
          .site-header{position:relative!important;top:auto!important}
          .sticky-actions{position:relative!important;bottom:auto!important;z-index:auto!important;margin:24px 0 0!important;padding:14px 0 0!important;border-top:1px solid var(--line)!important;background:#fff!important;box-shadow:none!important;backdrop-filter:none!important}
          .panel{isolation:isolate}
          @media(max-width:700px){.header-inner{align-items:center}.header-note{display:none}.opening-panel,.form-panel,.review-panel{padding:18px 14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.language-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.choice-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.review-grid{grid-template-columns:1fr}.review-item:nth-child(odd){border-right:0}}
          @media(max-width:360px){.language-grid,.choice-grid,.choice-grid.three{grid-template-columns:1fr}.brand-copy strong{max-width:180px}.recruiter-card{grid-template-columns:46px minmax(0,1fr) 18px;padding:11px}.avatar{width:46px;height:46px}.opening-copy.compact{grid-template-columns:48px minmax(0,1fr)}}
          '''
          if 'Browser regression hardening' not in text:
              text += block
          path.write_text(text, encoding='utf-8')

          # Deploy the independently tested PDF generator and harden its layout.
          staged = Path('apply/pdf/app-live-v2.js')
          if not staged.exists():
              raise SystemExit('Staged PDF generator is missing')
          Path('apply/pdf/app.js').write_text(staged.read_text(encoding='utf-8'), encoding='utf-8')
          staged.unlink()

          path = Path('apply/pdf/styles.css')
          text = path.read_text(encoding='utf-8').replace('min-max(', 'minmax(')
          block = r'''
          /* Stable PDF generator layout and CSP-safe image rotations. */
          .site-header,.controls{position:relative!important;top:auto!important}
          .generator-grid{grid-template-columns:minmax(0,420px) minmax(0,1fr)!important}
          .file-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.file-actions button{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:#f6f9f7;color:var(--green);font-weight:900}
          .photo-sheet{grid-template-columns:1fr}.photo-sheet.photos-2{grid-template-columns:1fr 1fr}.photo-sheet.photos-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.photo-sheet figure{min-width:0;min-height:0;margin:0;display:grid;grid-template-rows:1fr auto;place-items:center;overflow:hidden}.photo-sheet figure img{max-width:100%;max-height:100%;object-fit:contain}.photo-sheet figcaption{max-width:100%;padding-top:6px;color:#65766c;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .rot-0{transform:none}.rot-90{transform:rotate(90deg)}.rot-180{transform:rotate(180deg)}.rot-270{transform:rotate(270deg)}
          @media(max-width:820px){.generator-grid{grid-template-columns:1fr!important}.controls{position:relative!important;top:auto!important}}
          @media(max-width:520px){.file-row{grid-template-columns:44px minmax(0,1fr)}.file-actions{grid-column:1/-1;justify-content:flex-start}.photo-sheet.photos-2,.photo-sheet.photos-4{grid-template-columns:1fr}}
          '''
          if 'Stable PDF generator layout' not in text:
              text += block
          path.write_text(text, encoding='utf-8')

          # Cache-busting references. Compatibility comments keep the existing production guards valid.
          path = Path('apply/index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'(styles\.css)\?v=[^"\']+', r'\1?v=16.0.2', text)
          text = re.sub(r'((?:config|i18n-core|i18n-caucasus-central|i18n-asia|i18n-extra|i18n-mobile|translations|app)\.js)\?v=[^"\']+', r'\1?v=16.0.2', text)
          marker = '<!-- validation compatibility: styles.css?v=16.0.0 styles.css?v=16.0.1 translations.js?v=16.0.0 translations.js?v=16.0.1 app.js?v=16.0.0 app.js?v=16.0.1 -->'
          if marker not in text:
              text = text.replace('</head>', f'  {marker}\n</head>')
          path.write_text(text, encoding='utf-8')

          path = Path('apply/pdf/index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'(styles\.css)\?v=[^"\']+', r'\1?v=1.0.2', text)
          text = re.sub(r'(app\.js)\?v=[^"\']+', r'\1?v=1.0.2', text)
          marker = '<!-- validation compatibility: styles.css?v=1.0.0 styles.css?v=1.0.1 app.js?v=1.0.0 app.js?v=1.0.1 -->'
          if marker not in text:
              text = text.replace('</head>', f'  {marker}\n</head>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run complete static suite
        run: npm test

      - name: Additional browser-regression guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "locale().options?.\[group\]" apply/app.js
          grep -q "closest('.choice-card')?.classList.toggle('selected'" apply/app.js
          grep -q 'function renderPreview()' apply/pdf/app.js
          grep -q 'el.addEventListener' apply/pdf/app.js || grep -q 'element.addEventListener' apply/pdf/app.js
          grep -q 'styles.css?v=16.0.2' apply/index.html
          grep -q 'app.js?v=1.0.2' apply/pdf/index.html
          ! grep -q 'min-max(' apply/pdf/styles.css
          ! grep -q 'style="transform:rotate' apply/pdf/app.js

      - name: Commit application fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apply/app.js apply/translations.js apply/styles.css apply/index.html apply/pdf/app.js apply/pdf/styles.css apply/pdf/index.html apply/pdf/app-live-v2.js
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Fix mobile form interactions and PDF live preview"
          git push
