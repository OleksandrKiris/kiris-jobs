name: Short form draft dismissal diagnostic

on:
  push:
    branches: [codex/personal-draft-dismissal]
    paths:
      - .github/browser/short-apply-draft-dismissal.mjs
      - .github/workflows/short-apply-draft-dismissal.yml

permissions:
  contents: read

jobs:
  draft-dismissal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Exact diagnostic head parent and staged publication
        env:
          TESTED_HEAD: ${{ github.sha }}
          TESTED_BASE: ${{ github.event.before == '0000000000000000000000000000000000000000' && '4e1a93e54f48cc00c19be5256e13e91e6d4491e5' || github.event.before }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$TESTED_BASE"
          node scripts/build-pages-artifact.mjs build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          node scripts/build-pages-artifact.mjs verify "$GITHUB_WORKSPACE" "$RUNNER_TEMP/primserv-pages"
          git diff --exit-code
      - name: Install pinned Chromium tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/primserv-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/primserv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Anonymous draft dismissal and refused removal without delivery
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/primserv-browser/node_modules/playwright
          PAGES_ARTIFACT: ${{ runner.temp }}/primserv-pages
          BROWSER_REPORT: ${{ runner.temp }}/primserv-dismiss-report
          TESTED_HEAD: ${{ github.sha }}
          TESTED_BASE: ${{ github.event.before == '0000000000000000000000000000000000000000' && '4e1a93e54f48cc00c19be5256e13e91e6d4491e5' || github.event.before }}
        run: node .github/browser/short-apply-draft-dismissal.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: short-apply-draft-dismissal
          path: ${{ runner.temp }}/primserv-dismiss-report
          if-no-files-found: error
