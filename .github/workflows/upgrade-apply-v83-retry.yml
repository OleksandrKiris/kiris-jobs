name: Retry recruitment form 8.3 upgrade

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-apply-v83-retry.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upgrade-apply-v83-retry
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Correct validator and reuse the reviewed 8.3 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-apply.mjs')
          text = path.read_text(encoding='utf-8')
          old = "'window.location.href = buildMailto()'"
          new = "'window.location.assign(mailto)'"
          if old not in text:
              raise SystemExit('Old email launch validator marker was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/upgrade-apply-v83.yml > /tmp/upgrade-apply-v83.py

          test -s /tmp/upgrade-apply-v83.py
          python /tmp/upgrade-apply-v83.py

      - name: Validate complete repository
        run: npm test

      - name: Commit upgraded application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/pages.yml
          git add apply/config.js apply/index.html apply/app-mobile.js apply/mobile-v8.css scripts/validate-apply.mjs
          git commit -m "Improve mobile source selection and recruiter email"
          git push
