name: Backend Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record exact tested versions
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git rev-parse HEAD
          python -c 'import os; print("head=" + os.environ["TESTED_HEAD"]); print("base=" + os.environ["TESTED_BASE"])'
      - name: Validate backend test layout
        run: python .github/scripts/backend-ci.py --inspect
      - name: Install core-owned pinned dependencies when Django is present
        if: hashFiles('backend/manage.py') != ''
        run: python -m pip install -r backend/requirements.txt
      - name: Prove absent and failing backend behaviour
        run: python .github/scripts/backend-ci.test.py
      - name: Run all present backend tests and isolated Django checks
        run: python .github/scripts/backend-ci.py
