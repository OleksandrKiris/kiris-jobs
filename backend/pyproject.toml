[project]
name = "primserv-local-core"
version = "0.1.0"
description = "Standalone local-only Django API core for PrimServ"
requires-python = ">=3.12"
dependencies = ["Django==6.1.2", "jsonschema==4.23.0", "referencing==0.37.0"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*"]
